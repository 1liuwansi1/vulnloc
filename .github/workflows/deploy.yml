name: Verified bilingual research website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Default is disabled. A repository variable alone cannot bypass the
    # committed approval sidecar, checklist, and exact-candidate hash check.
    if: ${{ vars.PUBLIC_RELEASE_APPROVED == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SITE_URL: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require human-approved release candidate
        run: python3 -B scripts/check_publication_approval.py
      - uses: actions/setup-python@v5
        with:
          # Current result provenance binds this validated historical patch.
          python-version: '3.12.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked scientific dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m pip check
      - name: Verify frozen artifact and six-row results
        run: |
          .venv/bin/vulnloc verify
          .venv/bin/vulnloc verify-results
          .venv/bin/python -B -m unittest discover -s tests -v
          .venv/bin/python -B scripts/scan_candidate.py --output /tmp/candidate-scan.json
      - name: Install locked frontend dependencies
        working-directory: site
        run: npm ci
      - name: Validate, typecheck and test safety gates
        working-directory: site
        run: |
          npm run check
          npm run test:security
          npm audit --audit-level=high
      - name: Build bilingual static site and scan actual output
        working-directory: site
        run: npm run build
      - name: Browser regression on the built bilingual site
        working-directory: site
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --port 4321
          npm run test:browser
      - name: Configure approved Pages hosting
        uses: actions/configure-pages@v5
      - name: Upload only validated static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    if: ${{ vars.PUBLIC_RELEASE_APPROVED == 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
